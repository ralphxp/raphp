# The header is loaded by PHP through FFI::cdef(), which understands declarations only: no #include, no
# #define, no #ifndef guards. So the file is plain typedefs, one enum and function prototypes.
language = "C"
no_includes = true
cpp_compat = false
documentation = true
documentation_style = "c"
autogen_warning = "/* Generated by `make header` (cbindgen). Do not edit by hand. */"
usize_is_size_t = true
style = "type"

[export]
include = ["RaphpStatus"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
rename_args = "None"
